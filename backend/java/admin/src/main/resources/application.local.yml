server:
  port: 3002

spring:
  application:
    name: admin
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/wshake
    username: postgres
    password: postgres

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Go admin existing schema baseline

easy-query:
  enable: true
  database: pgsql

knife4j:
  enable: true
  setting:
    language: zh-CN

admin:
  rest-prefix: /api
  default-language: zh-CN
  auth:
    token-name: token
  temporal:
    enabled: true
    host-port: 127.0.0.1:7233
    namespace: default
    task-queue: admin-java
    worker-enabled: true
  storage:
    enabled: true
    engine: minio
    max-upload-bytes: 10485760
    object-key-prefix: uploads
    presigned-expires-seconds: 3600
    minio:
      endpoint: 127.0.0.1:9000
      access-key-id: minioadmin
      secret-access-key: minioadmin
      bucket: admin-files
      region: us-east-1
      use-ssl: false
      auto-create-bucket: true
  milvus:
    enabled: true
    address: 127.0.0.1:19530
    db-name: default
