spring:
  application:
    name: admin
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/wshake
    username: postgres
    password: postgres

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: Go admin existing schema baseline

easy-query:
  enable: true
  database: pgsql

server:
  port: 3002

sa-token:
  token-name: token
  is-read-cookie: true
  is-read-header: true
  timeout: 2592000

admin:
  rest-prefix: /api
  default-language: zh-CN
  auth:
    token-name: token
  temporal:
    enabled: false
    host-port: 127.0.0.1:7233
    namespace: default
    task-queue: admin-java
    worker-enabled: false
  storage:
    enabled: false
    engine: minio
    max-upload-bytes: 10485760
    object-key-prefix: uploads
    presigned-expires-seconds: 3600
    minio:
      endpoint: 127.0.0.1:9000
      bucket: admin-files
      auto-create-bucket: true
  milvus:
    enabled: true
    address: 127.0.0.1:19530
    db-name: default
  ai:
    embedding:
      provider: ark
      model: doubao-embedding-vision-251215
      dimensions: 2048
    knowledge:
      collection: biz
    memory:
      type: memory

logging:
  level:
    cn.harnesstemplate: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
