project_name: harness-template-cn

placeholders:
  app-root: front/apps
  package-root: front/packages
  infra-root: infra
  project-name: harness-template-cn

roots:
  backend: backend/go
  front: front
  apps: "{app-root}"
  packages: "{package-root}"
  infra: "{infra-root}"

modules:
  admin:
    name: 管理后台
    owner: project-maintainers
  web:
    name: 前端应用层
    owner: frontend-maintainers
  shared:
    name: 共享库与基础能力
    owner: platform-maintainers

services:
  admin-backend:
    module: admin
    repo_path: backend/go/admin
    package_path: backend/go/go-common
    infra_path: "{infra-root}/admin-backend"
    description: Go Fiber 管理后台 API 服务，默认读取 backend/go/admin/etc/config.yaml，暴露 /api 路由和 Swagger 文档。
  admin-java-backend:
    module: admin
    repo_path: backend/java/admin
    infra_path: "{infra-root}/admin-java-backend"
    description: Java Spring Boot 管理后台 API 服务 (迁移目标)，端口 3002，保留 /api 前缀。Spring Boot 3.5.9 + Java 25 + Sa-Token + jCasbin + Flyway + Easy Query + Temporal + MinIO + Milvus。
    startup: cd backend/java/admin && ./gradlew bootRun
    test: cd backend/java/admin && ./gradlew test
  admin-react:
    module: admin
    repo_path: "{app-root}/admin-react"
    package_path: "{package-root}"
    infra_path: "{infra-root}/admin-react"
    description: React 管理后台 SPA，使用 Vite/vite-plus、TanStack Router、Ant Design、MSW 和 @vp/* workspace 包。
  app-react:
    module: web
    repo_path: "{app-root}/app-react"
    package_path: "{package-root}"
    infra_path: "{infra-root}/app-react"
    description: React 客户端应用模板，复用 @vp/core、@vp/react-core、@vp/request 和 @vp/utils。
  app-react-ssr:
    module: web
    repo_path: "{app-root}/app-react-ssr"
    package_path: "{package-root}"
    infra_path: "{infra-root}/app-react-ssr"
    description: React SSR 应用模板，额外接入 TanStack Start/Nitro，复用前端 workspace 包。
  frontend-packages:
    module: shared
    repo_path: "{package-root}"
    package_path: "{package-root}"
    infra_path: "{infra-root}/frontend-packages"
    description: 前端共享包集合，包含 @vp/build-config、@vp/core、@vp/react-core、@vp/request 和 @vp/utils。
  go-shared-modules:
    module: shared
    repo_path: backend/go
    package_path: backend/go/go-common
    infra_path: "{infra-root}/go-shared-modules"
    description: Go workspace 共享模块，包含 go-common、orm-crud、sa-token/rueidis 等后台基础能力。
